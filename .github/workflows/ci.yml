# ──────────────────────────────────────────────────────────────────────────────
# CI Pipeline — Build & Push Docker Image
#
# Trigger: every push to main branch
#
# Flow:
#   1. Checkout code
#   2. Set up Docker Buildx (enables multi-platform builds and layer caching)
#   3. Login to DockerHub
#   4. Build and push image with two tags:
#      • latest         — used by deployment.yaml (ArgoCD polls for changes)
#      • {git-sha}      — immutable tag for rollback / audit trail
# ──────────────────────────────────────────────────────────────────────────────
name: Build & Push Docker Image

on:
  push:
    branches: ["main"]
    paths:
      # Only rebuild when app code or dependencies change
      - "app/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          platforms: linux/amd64,linux/arm64
          # Tag with both 'latest' and the exact git commit SHA
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fastapi-app:latest
            ${{ secrets.DOCKER_USERNAME }}/fastapi-app:${{ github.sha }}
          # Cache layers from the registry to speed up subsequent builds.
          # The multi-stage Dockerfile means the "builder" layer (pip install)
          # is only rebuilt when requirements.txt changes.
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/fastapi-app:buildcache
          cache-to:   type=registry,ref=${{ secrets.DOCKER_USERNAME }}/fastapi-app:buildcache,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build-and-push.outputs.digest }}"
