# apiVersion: v1
# kind: Service
# metadata:
#   name: fastapi-service
#   namespace: fastapi
# spec:
#   type: NodePort
#   selector:
#     app: fastapi
#   ports:
#     - port: 80
#       targetPort: 8000
#       nodePort: 30007
# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: redis-cluster
#   namespace: fastapi
# spec:
#   clusterIP: None   # Headless service
#   selector:
#     app: redis
#   ports:
#     - port: 6379
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: fastapi
spec:
  type: LoadBalancer
  selector:
    app: fastapi
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: fastapi
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP