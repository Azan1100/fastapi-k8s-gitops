apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: fastapi
spec:
  type: NodePort
  selector:
    app: fastapi
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30007
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: fastapi
spec:
  clusterIP: None   # Headless service
  selector:
    app: redis
  ports:
    - port: 6379
