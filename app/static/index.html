<!DOCTYPE html>
<html>
<head>
  <title>Redis Cluster Demo</title>
</head>
<body>
  <h1>🚀 Redis Cluster Dashboard</h1>

  <p id="msg"></p>
  <p id="visits"></p>
  <p id="hits"></p>

  <button onclick="loadData()">Refresh</button>

  <script>
    function loadData() {
      fetch("/api")
        .then(res => {
          console.log("Response status:", res.status);
          return res.json();
        })
        .then(data => {
          console.log("Data received:", data);
          document.getElementById("msg").innerText = data.message || "Error: No message";
          document.getElementById("visits").innerText = "Visits: " + (data.visits || "N/A");
          document.getElementById("hits").innerText = "Redis Hits: " + (data.redis_hits || "N/A");
        })
        .catch(error => {
          console.error("Error fetching data:", error);
          document.getElementById("msg").innerText = "Error: " + error.message;
          document.getElementById("visits").innerText = "Visits: Error";
          document.getElementById("hits").innerText = "Redis Hits: Error";
        });
    }

    // Load data on page load and refresh every 5 seconds
    loadData();
    setInterval(loadData, 5000);
  </script>
</body>
</html>
